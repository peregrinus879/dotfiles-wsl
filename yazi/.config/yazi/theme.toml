# Gruvbox overrides (only fixing readability; inherits terminal colors for the rest)

[mode]
normal_main = { fg = "#282828", bg = "#7daea3", bold = true }
normal_alt  = { fg = "#d4be98", bg = "#3c3836" }
select_main = { fg = "#282828", bg = "#d8a657", bold = true }
select_alt  = { fg = "#d8a657", bg = "#3c3836" }
unset_main  = { fg = "#282828", bg = "#ea6962", bold = true }
unset_alt   = { fg = "#ea6962", bg = "#3c3836" }

[status]
overall = {}
perm_sep   = { fg = "#665c54" }
perm_type  = { fg = "#a9b665" }
perm_read  = { fg = "#d8a657" }
perm_write = { fg = "#ea6962" }
perm_exec  = { fg = "#7daea3" }

[tabs]
active   = { fg = "#282828", bg = "#7daea3", bold = true }
inactive = { fg = "#d4be98", bg = "#3c3836" }

[mgr]
cwd = { fg = "#d8a657" }
border_style = { fg = "#665c54" }
count_copied   = { fg = "#282828", bg = "#a9b665" }
count_cut      = { fg = "#282828", bg = "#ea6962" }
count_selected = { fg = "#282828", bg = "#d8a657" }
