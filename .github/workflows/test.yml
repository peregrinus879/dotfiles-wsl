name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git jq lua5.4 python3 shellcheck stow tmux
          command -v luac > /dev/null || sudo ln -s "$(command -v luac5.4)" /usr/local/bin/luac
          curl -fsSL -o "$RUNNER_TEMP/fastfetch.deb" https://github.com/fastfetch-cli/fastfetch/releases/latest/download/fastfetch-linux-amd64.deb
          sudo apt-get install -y "$RUNNER_TEMP/fastfetch.deb"
      - run: make lint
      - run: make check
  twins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone EyrArcHy
        run: git clone --depth 1 https://github.com/peregrinus879/eyrarchy.git "$RUNNER_TEMP/eyrarchy"
      - run: make twins SIBLING="$RUNNER_TEMP/eyrarchy"
